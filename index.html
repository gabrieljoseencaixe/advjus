<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ADV.JUS — Gestão jurídica inteligente</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0a0a0d;--s1:#131318;--s2:#1b1b22;--ln:#2c2c36;--tx:#f5f2ea;--mu:#9d9ca8;--gold:#d4af37;--gold2:#f1d98a;--navy:#14213d;--ok:#4cc38a;--bad:#e5645a;--warn:#e8a23a;
--metal:linear-gradient(145deg,#34343b 0%,#0d0d10 48%,#26262d 100%);--goldg:linear-gradient(135deg,#a8821c,#f1d98a 45%,#c19a2b 70%,#8a6a14);
--serif:"Cormorant Garamond",Georgia,serif;--sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0d}}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f2ec;--s1:#fff;--s2:#eeebe2;--ln:#dcd6c6;--tx:#14141a;--mu:#6a6a76;--gold:#9a7712;--gold2:#7a5c0c;--ok:#1f8f5c;--bad:#c4392f;--warn:#b86f0a}}
:root[data-theme="light"]{--bg:#f4f2ec;--s1:#fff;--s2:#eeebe2;--ln:#dcd6c6;--tx:#14141a;--mu:#6a6a76;--gold:#9a7712;--gold2:#7a5c0c;--ok:#1f8f5c;--bad:#c4392f;--warn:#b86f0a}
:root[data-theme="dark"]{--bg:#0a0a0d;--s1:#131318;--s2:#1b1b22;--ln:#2c2c36;--tx:#f5f2ea;--mu:#9d9ca8;--gold:#d4af37;--gold2:#f1d98a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0d0d10;z-index:30}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--metal);color:#f5f2ea;display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #4a3d14}
.logo{font:700 24px/1 var(--serif);letter-spacing:.04em;background:var(--goldg);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo i{font-style:normal;color:#f5f2ea;-webkit-text-fill-color:#f5f2ea}
.top small{color:#a9a9b6;font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{background:#ffffff12;border:1px solid #ffffff22;border-radius:10px;width:38px;height:38px;color:#f1d98a}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:2px;overflow-x:auto;background:var(--metal);border-top:1px solid #4a3d14;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:0 0 auto;min-width:64px;background:none;border:0;color:#a9a9b6;padding:6px 8px;border-radius:10px;font-size:11px;display:grid;justify-items:center;gap:2px}
nav button b{font-size:18px;font-weight:400}
nav button.on{color:#f1d98a;background:#d4af3722}
main{padding:18px 16px;max-width:1100px;margin:0 auto}
h1{font:600 32px/1.1 var(--serif);margin:4px 0 4px}
h2{font:600 22px/1.2 var(--serif);margin:22px 0 10px}
.sub{color:var(--mu);margin:0 0 16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:14px}
.kpi{text-align:left;width:100%;background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:14px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--goldg)}
.kpi span{display:block;color:var(--mu);font-size:12px}
.kpi strong{font:600 30px/1.1 var(--serif);color:var(--gold)}
.hero{background:var(--metal),var(--navy);border:1px solid #4a3d14;border-radius:18px;padding:20px;color:#f5f2ea;margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(#14213d,transparent 70%)}
.hero h1{color:#f5f2ea}.hero p{color:#b9b9c6;margin:0;max-width:46ch;position:relative;z-index:1}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--ln);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}
.row p{margin:0}.row .m{color:var(--mu);font-size:12.5px}
.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:99px;border:1px solid var(--ln);color:var(--mu);white-space:nowrap}
.tag.g{color:var(--gold);border-color:var(--gold)}.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.bad{color:var(--bad);border-color:var(--bad)}.tag.w{color:var(--warn);border-color:var(--warn)}
.btn{background:var(--goldg);color:#17130a;border:0;border-radius:10px;padding:9px 14px;font-weight:700}
.btn.o{background:none;color:var(--gold);border:1px solid var(--gold)}
input,select{background:var(--s2);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;width:100%}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:8px}
.bars div{flex:1;background:var(--goldg);border-radius:6px 6px 0 0;position:relative;min-height:6px}
.bars div:nth-child(even){background:linear-gradient(#2b4271,var(--navy))}
.bars em{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-style:normal;font-size:11px;color:var(--mu)}
.scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.col{flex:0 0 78%;max-width:300px;background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:12px}
.col h3{margin:0 0 8px;font:600 18px var(--serif);display:flex;justify-content:space-between}
.k{background:var(--s2);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-top:8px;font-size:14px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--ln);margin:12px 0}
.tabs button{background:none;border:0;padding:9px 12px;color:var(--mu);border-bottom:2px solid transparent;white-space:nowrap}
.tabs .on{color:var(--gold);border-color:var(--gold)}
.chat{display:grid;gap:10px;margin:12px 0}
.msg{padding:12px 14px;border-radius:14px;max-width:92%;border:1px solid var(--ln);background:var(--s1)}
.msg.u{justify-self:end;background:var(--navy);color:#f5f2ea;border-color:#2b4271}
.msg h4{margin:8px 0 2px;font-size:12px;color:var(--gold)}
.msg a{color:var(--gold);cursor:pointer;text-decoration:underline}
.note{font-size:12.5px;color:var(--mu);border:1px dashed var(--ln);border-radius:10px;padding:10px;margin-top:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{background:var(--s2);border:1px solid var(--ln);border-radius:99px;padding:6px 12px;font-size:13px}
.bar2{display:flex;gap:8px}
@media (min-width:900px){
 body{padding-bottom:0;padding-left:230px}
 nav{top:0;bottom:0;right:auto;width:230px;flex-direction:column;overflow-y:auto;border-top:0;border-right:1px solid #4a3d14;padding:92px 12px 16px;gap:4px;box-shadow:6px 0 24px #0006}
 nav button{position:relative;display:flex;align-items:center;justify-content:flex-start;gap:14px;width:100%;min-width:0;text-align:left;font-size:14.5px;padding:12px 14px;letter-spacing:.01em;transition:background .15s,color .15s}
 nav button b{width:22px;text-align:center;font-size:17px}
 nav button:hover{background:#ffffff10;color:#f5f2ea}
 nav button.on{background:linear-gradient(90deg,#d4af3736,#d4af3706);font-weight:700}
 nav button.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--goldg)}
 .top{margin-left:-230px;padding-left:24px;z-index:25}
 .grid{grid-template-columns:repeat(4,1fr)}
 .two{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
 .col{flex:1;max-width:none}
}
.auth{max-width:420px;margin:4vh auto}
body.out{padding:0}body.out nav{display:none}body.out .top{margin-left:0}
@media (prefers-reduced-motion:no-preference){main{animation:in .35s ease}@keyframes in{from{opacity:.4}to{opacity:1}}}
</style>
</head>
<body>
<header class="top">
  <span class="logo">ADV<i>.</i>JUS</span><small id="ofc">Gestão jurídica inteligente</small>
  <button class="ib" id="lo" hidden style="width:auto;padding:0 12px;font-size:13px" aria-label="Sair">Sair</button><button class="ib" id="th" aria-label="Alternar tema">◐</button>
</header>
<nav id="nav"></nav>
<main id="app"></main>
<script>
var NAV=[["dash","◈","Painel"],["cli","☰","Clientes"],["proc","⚖","Processos"],["pz","◷","Prazos"],["tar","▦","Tarefas"],["doc","❏","Docs"],["fin","◎","Financeiro"],["ia","✦","IA"]];
var SEED={cli:[],proc:[],pz:[],tar:[],doc:[],fin:[]};
var D={cli:[],proc:[],pz:[],tar:[],doc:[],fin:[]},A=null,REC=null,DB=null,UID=null,MEM={},lastJ='',pt=null;
var S={am:'in',ready:0,nc:0,v:"dash",p:null,tab:0,chat:[{u:0,h:"Olá! Sou a <b>ADV.JUS Intelligence</b>. Consulto apenas dados autorizados do seu escritório e cito as fontes. Não substituo a análise do advogado."}]};
var $=function(s){return document.querySelector(s)};
function tag(t,c){return '<span class="tag '+(c||"")+'">'+t+'</span>'}
function head(t,s){return '<h1>'+t+'</h1><p class="sub">'+s+'</p>'}
function nav(){$("#nav").innerHTML=NAV.map(function(n){return '<button data-v="'+n[0]+'" class="'+(S.v==n[0]?"on":"")+'"><b>'+n[1]+'</b>'+n[2]+'</button>'}).join("")}
var V={
dash:function(){return V.dash0()},
cli:function(){var st=["Novo lead","Contato","Reunião","Proposta","Contratado"];
return head("Clientes","Funil de oportunidades e carteira.")+'<button class="btn" data-nc="1" style="margin-bottom:12px">'+(S.nc?"Cancelar":"+ Novo cliente")+'</button>'+(S.nc?cform():'')+'<div class="scroll">'+st.map(function(s){var l=D.cli.filter(function(c){return c[2]==s||(s=="Contato"&&c[2]=="Contato")});return '<div class="col"><h3>'+s+tag(l.length,"g")+'</h3>'+l.map(function(c){return '<div class="k"><b>'+esc(c[0])+'</b><br><span class="m" style="color:var(--mu)">'+c[1]+' · '+c[3]+'</span></div>'}).join("")+'</div>'}).join("")+'</div>'+'<p class="note">Duplicidades são detectadas por CPF/CNPJ e contatos; a mesclagem é auditada. Dados coletados seguem a LGPD.</p>'},
proc:function(){if(S.p!==null)return V.det(D.proc[S.p]);
return head("Processos","Busque por número, cliente, tribunal ou área.")+'<input id="q" placeholder="Buscar processo…" aria-label="Buscar processo"><div class="card" id="pl" style="margin-top:12px">'+V.pl("")+'</div>'},
pl:function(q){q=q.toLowerCase();var l=D.proc.filter(function(p){return (p.n+p.c+p.t+p.a).toLowerCase().indexOf(q)>-1});return l.length?l.map(function(p){return '<button class="row" data-p="'+p.id+'"><div><p><b>'+p.c+'</b></p><p class="m">'+p.n+'<br>'+p.t+'</p></div><div style="text-align:right">'+tag(p.f,"g")+'<p class="m">'+p.a+'</p></div></button>'}).join(""):'<p class="m">Nenhum processo encontrado. Ajuste a busca ou cadastre um novo.</p>'},
det:function(p){var T=["Visão geral","Movimentações","Prazos","Documentos","Financeiro"];var b;
if(S.tab==0)b='<div class="card">'+[["Tribunal",p.t],["Área",p.a],["Fase",p.f],["Valor da causa",p.v],["Responsável",p.r]].map(function(x){return '<div class="row"><span class="m">'+x[0]+'</span><b>'+x[1]+'</b></div>'}).join("")+'</div>';
else if(S.tab==1)b='<div class="card">'+p.ev.map(function(e){return '<div class="row"><div><p>'+e+'</p><p class="m">Fonte: DataJud · sincronizado '+p.s+'</p></div>'+tag("Evento externo")+'</div>'}).join("")+'<div class="row"><div><p>Estratégia revisada com o cliente</p><p class="m">Registro interno</p></div>'+tag("Interno","g")+'</div></div>';
else if(S.tab==2)b='<div class="card">'+D.pz.slice(0,2).map(function(x){return '<div class="row"><p>'+x.d+' — '+x.t+'</p>'+tag(x.st,"ok")+'</div>'}).join("")+'</div>';
else if(S.tab==3)b='<div class="card">'+D.doc.slice(0,2).map(function(x){return '<div class="row"><p>'+x[0]+'</p>'+tag(x[1])+'</div>'}).join("")+'</div>';
else b='<div class="card"><div class="row"><p>Honorários contratuais</p>'+tag("R$ 12.000","g")+'</div><div class="row"><p>Custas adiantadas</p>'+tag("R$ 1.280")+'</div></div>';
return '<button class="btn o" data-p="x">← Processos</button><h1 style="margin-top:14px">'+p.c+'</h1><p class="sub">'+p.n+'</p><div class="tabs">'+T.map(function(t,i){return '<button data-t="'+i+'" class="'+(S.tab==i?"on":"")+'">'+t+'</button>'}).join("")+'</div>'+b},
pz:function(){return head("Prazos e agenda","Sugestões da IA ficam pendentes até a sua confirmação.")+'<div class="card">'+D.pz.map(function(x,i){return '<div class="row"><div><p><b>'+x.d+'</b> · '+x.t+'</p><p class="m">Responsável: '+x.r+'</p></div>'+(x.st=="Pendente"?'<button class="btn" data-ok="'+i+'">Confirmar</button>':tag(x.st,"ok"))+'</div>'}).join("")+'</div><p class="note">O cálculo de prazos depende de feriados e suspensões do tribunal; sempre confira antes de confirmar.</p>'},
tar:function(){var c=["A fazer","Em andamento","Concluída"];return head("Tarefas","Toque em uma tarefa para avançar a etapa.")+'<div class="scroll">'+c.map(function(s){var l=D.tar.map(function(t,i){return[t,i]}).filter(function(t){return t[0][1]==s});return '<div class="col"><h3>'+s+tag(l.length,"g")+'</h3>'+l.map(function(t){return '<button class="k" style="width:100%;text-align:left" data-tk="'+t[1]+'">'+esc(t[0][0])+'</button>'}).join("")+'</div>'}).join("")+'</div><div class="bar2" style="margin-top:12px"><input id="nt" placeholder="Nova tarefa…" aria-label="Nova tarefa"><button class="btn" data-add="1">Adicionar</button></div>'},
doc:function(){return head("Documentos","Biblioteca por cliente e processo, com busca e controle de acesso.")+'<div class="card">'+D.doc.map(function(d){return '<div class="row"><div><p><b>'+d[0]+'</b></p><p class="m">'+d[2]+'</p></div>'+tag(d[1],d[1]=="Rascunho IA"?"w":"g")+'</div>'}).join("")+'</div><p class="note">Arquivos passam por antivírus e OCR. Só chegam ao portal do cliente se você marcar como visível.</p>'},
fin:function(){return head("Financeiro","Honorários, despesas e inadimplência.")+'<div class="grid">'+fk().map(function(k){return '<div class="kpi"><span>'+k[0]+'</span><strong>'+k[1]+'</strong></div>'}).join("")+'</div><h2>Lançamentos</h2><div class="card">'+D.fin.map(function(f){return '<div class="row"><div><p>'+f[0]+'</p><p class="m">'+f[1]+' · vence '+f[3]+'</p></div><div style="text-align:right"><b>'+f[2]+'</b><br>'+tag(f[4],f[4]=="Atrasado"?"bad":"")+'</div></div>'}).join("")+'</div>'},
ia:function(){return head("ADV.JUS Intelligence","Pergunte sobre prazos, processos, finanças ou peça um rascunho.")+'<div class="chips">'+["Quais prazos vencem esta semana?","Quem está inadimplente?","Redigir minuta de contestação"].map(function(c){return '<button data-q="'+c+'">'+c+'</button>'}).join("")+'</div><div class="chat">'+S.chat.map(function(m){return '<div class="msg '+(m.u?"u":"")+'">'+m.h+'</div>'}).join("")+'</div><div class="bar2"><input id="iq" placeholder="Escreva sua pergunta…" aria-label="Pergunta para a IA"><button class="btn" data-send="1">Enviar</button></div><p class="note">Demonstração com respostas simuladas. Na versão real, cada resposta cita documento e página, e rascunhos exigem aprovação de advogado.</p>'}};
function opts(a){return a.map(function(x){return '<option>'+x+'</option>'}).join('')}
function cform(){return '<div class="card" style="margin-bottom:14px;display:grid;gap:10px"><b>Novo cliente</b><input id="cn" placeholder="Nome ou razão social" aria-label="Nome ou razão social"><input id="cd" placeholder="CPF/CNPJ (opcional)" aria-label="CPF ou CNPJ"><input id="cc" placeholder="Telefone ou e-mail" aria-label="Contato"><select id="ct" aria-label="Tipo">'+opts(["PF","PJ"])+'</select><select id="ce2" aria-label="Etapa do funil">'+opts(["Novo lead","Contato","Reunião","Proposta","Contratado"])+'</select><select id="ca" aria-label="Área jurídica">'+opts(["Cível","Trabalhista","Previdenciário","Família","Empresarial","Tributário","Consumidor"])+'</select><p class="m" id="ce" style="margin:0;color:var(--bad);font-size:13px"></p><button class="btn" data-sv="1">Salvar cliente</button></div>'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function num(s){return +String(s).replace(/[^\d,]/g,'').replace(',','.')}
function brl(n){return 'R$ '+n.toLocaleString('pt-BR')}
function fk(){var r=0,p=0,a=0,d=0;D.fin.forEach(function(f){var v=num(f[2]);if(f[1]=='Pagar')d+=v;else if(f[4]=='Pago')p+=v;else{r+=v;if(f[4]=='Atrasado')a+=v}});return[['A receber',brl(r)],['Recebido',brl(p)],['Em atraso',brl(a)],['A pagar',brl(d)]]}
function kpd(){return[['Processos ativos',D.proc.length,'proc'],['Prazos confirmados',D.pz.filter(function(x){return x.st=='Confirmado'}).length,'pz'],['Tarefas abertas',D.tar.filter(function(t){return t[1]!='Concluída'}).length,'tar'],['A receber',fk()[0][1],'fin']]}
V.dash0=function(){return '<div class="hero"><h1>Olá, '+esc(A.user)+'.</h1><p>Seu escritório está pronto. Comece cadastrando o primeiro cliente.</p></div><div class="grid">'+kpd().map(function(k){return '<button class="kpi" data-v="'+k[2]+'"><span>'+k[0]+'</span><strong>'+k[1]+'</strong></button>'}).join('')+'</div><div class="card" style="margin-top:14px"><p style="margin:0 0 8px">Nada por aqui ainda.</p><button class="btn" data-v="cli">Cadastrar cliente</button></div>'};
function ans(q){var l=q.toLowerCase();
if(/prazo|vence|semana/.test(l)){var c=D.pz.filter(function(x){return x.st=='Confirmado'}),p=D.pz.filter(function(x){return x.st=='Pendente'});
if(!c.length&&!p.length)return 'Não há prazos cadastrados neste escritório ainda.';
return tag('Resposta com fontes','g')+'<h4>Fatos extraídos</h4>'+(c.length?c.map(function(x){return esc(x.d)+' — '+esc(x.t)}).join('<br>'):'Nenhum prazo confirmado.')+(p.length?'<h4>Requer confirmação</h4>'+p.length+' prazo(s) pendente(s) de confirmação.':'')}
if(/inadimpl|honor|receb|finan/.test(l)){var a=D.fin.filter(function(f){return f[4]=='Atrasado'});
if(!D.fin.length)return 'Não há lançamentos financeiros cadastrados neste escritório ainda.';
return tag('Resposta com fontes','g')+'<h4>Fatos extraídos</h4>'+(a.length?a.map(function(f){return esc(f[0])+' — '+esc(f[2])}).join('<br>'):'Nenhum lançamento em atraso.')}
if(/minuta|contesta|peça|petição|rascunho/.test(l))return tag('Rascunho','w')+' '+tag('Requer revisão','w')+'<h4>Estrutura proposta</h4>1. Síntese dos fatos · 2. Preliminares · 3. Mérito · 4. Pedidos.<h4>Lacunas</h4>Selecione o processo e anexe os documentos para eu citar as fontes. Exportar ou assinar só após aprovação do advogado.';
return 'Não encontrei fonte suficiente nos registros autorizados para responder com segurança. Indique o processo ou anexe o documento, ou peça revisão de um advogado.'}
function go(v){S.nc=0;S.v=v;S.p=null;S.tab=0;draw()}
function draw(){document.body.classList.toggle('out',!A);nav();$('#lo').hidden=!A;$('#ofc').textContent=A?A.name+' · '+A.user:'Gestão jurídica inteligente';$('#app').innerHTML=A?V[S.v]():authView();window.scrollTo(0,0);persist()}
function send(q){if(!q)return;S.chat.push({u:1,h:q.replace(/</g,"&lt;")},{u:0,h:ans(q)});S.v="ia";nav();$("#app").innerHTML=V.ia();window.scrollTo(0,document.body.scrollHeight)}
document.addEventListener("click",function(e){var t=e.target.closest("[data-v],[data-p],[data-t],[data-ok],[data-tk],[data-add],[data-q],[data-send],[data-go],[data-nc],[data-sv],[data-am],[data-auth],[data-ap]");if(!t)return;var d=t.dataset;
if(d.v)return go(d.v);
if(d.go){S.v="proc";S.p=+d.go;S.tab=1;return draw()}
if(d.p){S.p=d.p=="x"?null:+d.p;S.tab=0;return draw()}
if(d.t){S.tab=+d.t;return draw()}
if(d.ok){D.pz[+d.ok].st="Confirmado";D.pz[+d.ok].r=A.user;return draw()}
if(d.tk){var x=D.tar[+d.tk],o=["A fazer","Em andamento","Concluída"];x[1]=o[Math.min(2,o.indexOf(x[1])+1)];return draw()}
if(d.add){var v=$("#nt").value.trim();if(v){D.tar.unshift([v,"A fazer"]);draw()}return}
if(d.ap)return setAp(d.ap,d.on==='1');
if(d.am){if(d.am=='adm')return adminPanel();S.am=d.am;return draw()}
if(d.auth)return doAuth();
if(d.nc){S.nc=S.nc?0:1;return draw()}
if(d.sv){var n=$("#cn").value.trim();if(!n){$("#ce").textContent="Informe o nome do cliente.";$("#cn").focus();return}D.cli.unshift([n,$("#ct").value,$("#ce2").value,$("#ca").value]);S.nc=0;return draw()}
if(d.q)return send(d.q);
if(d.send)return send($("#iq").value.trim())});
document.addEventListener("input",function(e){if(e.target.id=="q")$("#pl").innerHTML=V.pl(e.target.value)});
document.addEventListener("keydown",function(e){if(e.key=="Enter"&&e.target.id=="iq")send(e.target.value.trim())});
$("#th").onclick=function(){var r=document.documentElement,d=r.dataset.theme?r.dataset.theme=="dark":!matchMedia("(prefers-color-scheme: light)").matches;r.dataset.theme=d?"light":"dark"};
function clone(o){return JSON.parse(JSON.stringify(o))}
function slugf(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)}
function b64(u){return btoa(String.fromCharCode.apply(null,u))}
function unb(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function ph(p,salt){var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);return b64(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:210000,hash:'SHA-256'},k,256)))}
function dref(s){return DB.collection('data/users/'+UID).doc('office_'+s)}
async function load(s){if(DB&&UID){var x=await dref(s).get();return x.exists?clone(x.data()):null}return MEM[s]?clone(MEM[s]):null}
async function save(s,r){if(DB&&UID)await dref(s).set(r);else MEM[s]=clone(r)}
function persist(){if(!A)return;var j=JSON.stringify(D);if(j==lastJ)return;lastJ=j;clearTimeout(pt);var s=A.slug,r=Object.assign({},REC,{data:clone(D)});pt=setTimeout(function(){save(s,r).catch(function(){})},600)}
function authView(){if(!S.ready)return '<div class="auth"><div class="hero"><h1>ADV.JUS</h1><p>Carregando…</p></div></div>';var up=S.am=='up';if(S.am=='adm')return admView();
return '<div class="auth"><div class="hero"><h1>ADV.JUS</h1><p>Entre no seu escritório ou crie um novo em poucos segundos.</p></div><div class="card" style="display:grid;gap:10px"><div class="tabs" style="margin:0"><button data-am="in" class="'+(up?'':'on')+'">Entrar</button><button data-am="up" class="'+(up?'on':'')+'">Criar escritório</button></div><input id="ao" placeholder="Nome do escritório" autocomplete="organization" aria-label="Nome do escritório"><input id="au" placeholder="Usuário (seu nome)" autocomplete="username" aria-label="Usuário"><input id="ap" type="password" placeholder="Senha" autocomplete="'+(up?'new-password':'current-password')+'" aria-label="Senha">'+'<p id="am" role="alert" style="margin:0;color:var(--bad);font-size:13px"></p><button class="btn" data-auth="1">'+(up?'Criar escritório e entrar':'Entrar')+'</button></div><p class="note">'+(DB&&UID?'Cada escritório tem os seus próprios dados, protegidos por senha. A senha é guardada apenas como hash. Novos cadastros só entram após a ativação pelo administrador.':'Acesso restrito: entre com a conta Claude autorizada para usar o ADV.JUS.')+'</p>'+(OWN?'<button class="btn o" data-am="adm" style="width:100%">Painel do administrador</button>':'')+'</div>'}
function fail(m){var e=$('#am');if(e)e.textContent=m}
function enter(s,r){A={slug:s,name:r.name,user:r.user,demo:r.demo};REC={name:r.name,user:r.user,salt:r.salt,hash:r.hash,demo:r.demo};D=Object.assign({cli:[],proc:[],pz:[],tar:[],doc:[],fin:[]},clone(r.data));lastJ=JSON.stringify(D);S.v='dash';S.p=null;draw()}
var OWN=false;
function gated(){return !(DB&&UID)}
function msg(m,ok){var e=$('#am');if(e){e.textContent=m;e.style.color=ok?'var(--ok)':'var(--bad)'}}
async function approved(s){try{var x=await DB.collection('approvals').doc(UID+'_'+s).get();return x.exists&&x.data().active===true}catch(e){return false}}
async function reqOffice(s,n,u){var r=DB.collection('requests').doc(UID),x=await r.get(),o=x.exists?(x.data().offices||{}):{};o[s]={name:n,user:u,at:new Date().toISOString()};await r.set({uid:UID,offices:o})}
async function signup(){if(gated())return fail('Acesso restrito. Abra o link com a conta Claude autorizada.');
var n=$('#ao').value.trim(),u=$('#au').value.trim(),p=$('#ap').value,s=slugf(n);
if(!s||u.length<2)return fail('Informe o nome do escritório e o seu nome de usuário.');
if(p.length<8)return fail('A senha precisa ter ao menos 8 caracteres.');
try{if(await load(s))return fail('Já existe um escritório com esse nome. Entre ou escolha outro nome.');var salt=crypto.getRandomValues(new Uint8Array(16));var r={name:n,user:u,salt:b64(salt),hash:await ph(p,salt),demo:false,data:{cli:[],proc:[],pz:[],tar:[],doc:[],fin:[]}};await save(s,r);await reqOffice(s,n,u);$('#ap').value='';msg('Cadastro enviado! Seu acesso será liberado após a ativação pelo administrador.',1)}catch(e){fail('Não foi possível enviar o cadastro agora. Tente novamente.')}}
async function login(){if(gated())return fail('Acesso restrito. Abra o link com a conta Claude autorizada.');
var n=$('#ao').value.trim(),u=$('#au').value.trim().toLowerCase(),p=$('#ap').value,s=slugf(n);
try{var r=s?await load(s):null;if(r&&r.user.toLowerCase()==u&&await ph(p,unb(r.salt))===r.hash){if(!(await approved(s)))return fail('Cadastro aguardando ativação pelo administrador.');return enter(s,r)}await new Promise(function(f){setTimeout(f,900)});fail('Escritório, usuário ou senha incorretos.')}catch(e){fail('Não foi possível entrar agora. Tente novamente.')}}
async function adminPanel(){try{var q=await DB.collection('requests').get(),ap=await DB.collection('approvals').get(),on={};ap.docs.forEach(function(d){on[d.id]=d.data().active===true});var rows=[];q.docs.forEach(function(d){var o=d.data().offices||{};Object.keys(o).forEach(function(k){rows.push({id:d.id+'_'+k,name:o[k].name,user:o[k].user,at:o[k].at,on:!!on[d.id+'_'+k]})})});S.admin=rows}catch(e){S.admin=[]}S.am='adm';draw()}
async function setAp(id,v){try{await DB.collection('approvals').doc(id).set({active:v,at:new Date().toISOString()})}catch(e){}adminPanel()}
function admView(){return '<div class="auth"><div class="hero"><h1>Administração</h1><p>Ative ou desative o acesso de cada escritório.</p></div><div class="card">'+(S.admin&&S.admin.length?S.admin.map(function(r){return '<div class="row"><div><p><b>'+esc(r.name)+'</b></p><p class="m">'+esc(r.user)+' · '+esc((r.at||'').slice(0,10))+'</p></div><div style="display:flex;gap:8px;align-items:center">'+tag(r.on?'Ativo':'Pendente',r.on?'ok':'w')+'<button class="btn'+(r.on?' o':'')+'" data-ap="'+esc(r.id)+'" data-on="'+(r.on?0:1)+'">'+(r.on?'Desativar':'Ativar')+'</button></div></div>'}).join(''):'<p class="m">Nenhum cadastro ainda.</p>')+'</div><button class="btn o" data-am="in" style="margin-top:12px">← Voltar</button></div>'}
function doAuth(){if(S.busy)return;S.busy=1;(S.am=='up'?signup():login()).finally(function(){S.busy=0})}
document.addEventListener('keydown',function(e){if(e.key=='Enter'&&/^a[oup]$/.test(e.target.id))doAuth()});
$('#lo').onclick=async function(){try{clearTimeout(pt);if(A)await save(A.slug,Object.assign({},REC,{data:clone(D)}))}catch(e){}A=null;REC=null;D={cli:[],proc:[],pz:[],tar:[],doc:[],fin:[]};S.chat=[S.chat[0]];S.v='dash';S.p=null;S.am='in';draw()};
async function init(){try{if(typeof claude!='undefined'){DB=await claude.use('db');var u=await claude.use('user');UID=u?await u.id():null;try{OWN=u?await u.isOwner():false}catch(e){}}}catch(e){}S.ready=1;draw()}
draw();init();
</script>
